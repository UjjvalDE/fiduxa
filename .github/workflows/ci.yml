name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend lint + typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx eslint app lib componets hooks --max-warnings=0
      - run: npx tsc --noEmit -p .
        env:
          NODE_OPTIONS: --max-old-space-size=4096

  backend:
    name: Backend unit + e2e
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports:
          - 27999:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand(\"ping\").ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: server
    env:
      MONGODB_TEST_URI: mongodb://127.0.0.1:27999
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - name: App boots
        run: node --input-type=module -e "import('./src/app.js').then(() => console.log('ok'))"
      - name: Unit tests
        run: npm test
      - name: API end-to-end tests
        run: npm run test:e2e
